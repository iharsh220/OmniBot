<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>OmniChat Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/widget.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="#overview"><img src="/favicon.svg" alt="" /><div><b>OmniChat</b><small>Stream Studio</small></div></a>

    <div class="nav-label">Workspace</div>
    <a class="nav-item" data-page="overview" href="#overview"><span data-icon="home"></span>Overview<span class="dot-live" id="nav-live" hidden></span></a>
    <a class="nav-item" data-page="studio" href="#studio"><span data-icon="palette"></span>Studio<span class="count" id="nav-widgets">0</span></a>
    <a class="nav-item" data-page="tools" href="#tools"><span data-icon="zap"></span>Live tools</a>
    <a class="nav-item" data-page="connections" href="#connections"><span data-icon="plug"></span>Connections</a>
    <a class="nav-item" data-page="eggs" href="#eggs"><span data-icon="egg"></span>Egg Bot</a>
    <a class="nav-item" data-page="logs" href="#logs"><span data-icon="logs"></span>Logs</a>

    <div class="nav-label">Account</div>
    <a class="nav-item" data-page="settings" href="#settings"><span data-icon="settings"></span>Settings</a>

    <div class="sidebar-foot">
      <div class="theme-switch" id="theme-switch" role="group" aria-label="Theme"></div>
      <div class="user-card">
        <div class="avatar" id="user-av"></div>
        <div class="meta"><b id="user-name">…</b><span id="user-sub"></span></div>
        <button class="btn ghost sm icon" id="logout" title="Sign out" aria-label="Sign out"><span data-icon="logout"></span></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon menu-btn" id="menu-btn" aria-label="Open menu"><span data-icon="menu"></span></button>
      <div><h1 id="page-title">Overview</h1><p id="page-sub"></p></div>
      <div class="spacer"></div>
      <div class="status-pills">
        <span class="pill" id="pill-server"><span class="dot"></span>Server</span>
        <span class="pill" id="pill-youtube"><span class="dot"></span>YouTube</span>
        <span class="pill" id="pill-kick"><span class="dot"></span>Kick</span>
      </div>
    </header>

    <section class="page" id="page-overview" hidden></section>

    <section class="page full" id="page-studio" hidden>
      <div class="studio">
        <div class="config">
          <div class="config-head">
            <div class="wpick">
              <select class="select" id="widget-select" aria-label="Widget"></select>
              <button class="btn primary icon" id="new-widget" title="New widget" aria-label="New widget"><span data-icon="plus"></span></button>
            </div>
            <div class="wname">
              <input class="input" id="widget-name" maxlength="60" placeholder="Widget name" aria-label="Widget name" />
              <span class="save-state" id="save-state"></span>
            </div>
          </div>
          <div class="config-body" id="config-body"></div>
        </div>

        <div class="preview-col">
          <div class="card urlcard">
            <div class="urlrow">
              <input class="url" id="url" readonly spellcheck="false" aria-label="Widget URL" />
              <button class="btn primary" id="copy"><span data-icon="copy"></span>Copy URL</button>
              <a class="btn" id="open" target="_blank" rel="noopener noreferrer"><span data-icon="external"></span>Open</a>
              <button class="btn icon" id="rotate" title="Generate a new URL (old one stops working)" aria-label="Regenerate URL"><span data-icon="key"></span></button>
            </div>
            <div class="urlhint">
              <span><span data-icon="monitor"></span>OBS → Sources → Browser</span>
              <span><span data-icon="layout"></span>Size <b id="size-hint">400 × 700</b></span>
              <span><span data-icon="zap"></span>Edits go live instantly — no need to re-copy</span>
            </div>
          </div>
          <div class="type-help" id="type-help"></div>
          <div class="toolbar">
            <div class="seg" id="feed-mode"><button data-v="demo" class="on">Demo</button><button data-v="live">Live</button></div>
            <div class="seg" id="backdrop">
              <button data-v="game" class="on">Game</button><button data-v="checker">Transparent</button>
              <button data-v="dark">Dark</button><button data-v="light">Light</button><button data-v="green">Green</button>
            </div>
            <div class="spacer"></div>
            <button class="btn sm ghost" id="clear"><span data-icon="refresh"></span>Clear preview</button>
          </div>
          <div class="stage bd-game" id="stage">
            <div class="frame chat-frame" id="chat-frame" data-size="400 × 700 · OBS size"><div id="chat-preview"></div></div>
            <div class="frame stats-frame" id="stats-frame" data-size="Stats widget" hidden><div id="stats-preview"></div></div>
            <div class="frame eggs-frame" id="eggs-frame" data-size="Eggs overlay" hidden><div id="eggs-preview"></div></div>
            <div class="frame alerts-frame" id="alerts-frame" data-size="900 × 260 · OBS size" hidden><div id="alerts-preview"></div></div>
            <div class="frame goal-frame" id="goal-frame" data-size="700 × 120 · OBS size" hidden><div id="goal-preview"></div></div>
            <div class="frame poll-frame" id="poll-frame" data-size="520 × 360 · OBS size" hidden><div id="poll-preview"></div></div>
          </div>
          <div class="testbar" id="alert-tests" hidden></div>
        </div>
      </div>
    </section>

    <section class="page" id="page-tools" hidden></section>
    <section class="page" id="page-connections" hidden></section>
    <section class="page" id="page-eggs" hidden></section>
    <section class="page" id="page-logs" hidden></section>
    <section class="page" id="page-settings" hidden></section>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
